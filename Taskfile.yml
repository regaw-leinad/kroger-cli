version: '3'

tasks:
  build:
    desc: Build the kroger binary
    deps: [fmt, vet]
    cmds:
      - mkdir -p bin
      - go build -o bin/kroger .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/kroger

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  test:
    desc: Run all tests
    deps: [build]
    cmds:
      - go test ./...

  lint:
    desc: Run all checks (vet, fmt, test)
    deps: [fmt:check, vet, test]

  install:
    desc: Install kroger to $GOPATH/bin
    deps: [fmt, vet]
    cmds:
      - go install .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
